version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: recordatorios_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reminder_app
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recordatorios_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=reminder_app
      - JWT_SECRET=super_secret_key_123
      - PORT=3000
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recordatorios_frontend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - BACKEND_URL=http://backend:3000
    depends_on:
      - backend
    networks:
      - default
      - vigicloud_net

volumes:
  db_data:

networks:
  vigicloud_net:
    external: true
